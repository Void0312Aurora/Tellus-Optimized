plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
	id 'eclipse'
	id 'maven-publish'
}

ext.tellus = [
	minecraftVersion: '1.20.1',
	loaderVersion: '0.16.10',
	fabricVersion: '0.92.8+1.20.1',
	fabricDependencyConfiguration: 'modImplementation',
	javaVersion: 17,
	distantHorizonsRuntimeProperty: 'mc1201_distant_horizons_runtime_path',
	sharedSourceLayers: ['pre-26', 'mc1201', 'fabric', 'pre-26-fabric'],
	mapboxVersion: '23.2.0',
	protobufVersion: '3.25.5',
	officialMappings: true,
	testDistantHorizonsRuntime: false,
	overriddenSharedMainSources: [
		'com/yucareux/tellus/network/GeoTpOpenMapPayload.java',
		'com/yucareux/tellus/network/GeoTpTeleportPayload.java',
		'com/yucareux/tellus/worldgen/EarthBiomeSource.java',
	]
]

apply from: rootProject.file('gradle/tellus-fabric.gradle')

// Test JVMs do not inherit Gradle's system properties. Exercise the opt-in path
// in its own process so static executor configuration is reproducible.
tasks.register('testParallelChunkgen', Test) {
	group = 'verification'
	description = 'Tests section output and task failures with parallel chunk filling enabled.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	javaLauncher = tasks.named('test', Test).get().javaLauncher
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.yucareux.tellus.worldgen.TellusWorldgenSourcesTest'
		includeTestsMatching 'com.yucareux.tellus.worldgen.ParallelSolidSectionFillTest'
	}
	def testGameDir = layout.buildDirectory.dir('parallel-chunkgen-test-game').get().asFile
	systemProperty 'tellus.gameDir', testGameDir.absolutePath
	systemProperty 'tellus.configDir', new File(testGameDir, 'config').absolutePath
	systemProperty 'tellus.chunkgen.parallelSolidSections', 'true'
	systemProperty 'tellus.chunkgen.threads.max', '44'
}

tasks.named('check') {
	dependsOn tasks.named('testParallelChunkgen')
}
